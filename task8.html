
<!DOCTYPE html>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">JavaScript Basics</a>

        <div class="nav-links">
            <a href="index.html">Task 0</a>
            <a href="task1.html">Task 1</a>

        </div>
    </nav>

    <main class="container">
        <h1>Interactive To-Do List</h1>
        <p class="subtitle">Task 8 - Mini Project</p>

        <div class="todo-container">
            <section class="todo-list-section">
                <h2>To-do list</h2>

                <div id="taskList"></div>

                <p id="taskCount">0 tasks remaining</p>
            </section>

            <section class="add-task-section">
                <h2>Add new task</h2>

                <form id="taskForm">
                    <label for="taskTitle">* Title</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Enter task title"
                        required
                    >

                    <label for="taskDescription">
                        * Description
                    </label>
                    <textarea
                        id="taskDescription"
                        placeholder="Enter task description"
                        required
                    ></textarea>

                    <button type="submit" id="addBtn">
                        Add task
                    </button>
                </form>
            </section>
        </div>
    </main>

    <script src="task8.js"></script>
</body>
</html>
